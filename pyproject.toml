[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "i-am-feeling-lucky"
version = "0.1.3"
description = "You feel lucky and you are."
readme = "README.MD"
authors = [
    { name = "NecoDev", email = "necodev@icloud.com" }
]
requires-python = ">=3.8"
[project.scripts]
i-am-feeling-lucky = "i_am_feeling_lucky.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["i_am_feeling_lucky"]
include-package-data = true

[tool.setuptools.package-data]
i_am_feeling_lucky = ["questions.json"]